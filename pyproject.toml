[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memtrace"
version = "0.1.0"
description = "Memorization and membership-inference auditor for fine-tuned language models (LoRA / PEFT)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "MemTrace contributors" }]
keywords = ["privacy", "membership-inference", "memorization", "llm", "lora", "peft", "ai-security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.11",
  "tokenizers>=0.19",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
hf = ["datasets>=2.19"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.17.4"]

[project.scripts]
memtrace = "memtrace.cli:app"

[tool.setuptools.packages.find]
include = ["memtrace*"]

[tool.setuptools.package-data]
memtrace = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905", "E501", "E731"]
