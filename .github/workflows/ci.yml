name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch)
        run: python -m pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: ruff check memtrace tests experiments app
      - name: Test
        run: python -m pytest
